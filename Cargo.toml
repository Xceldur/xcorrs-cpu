[package]
name = "xcorrrs"
version = "1.2.0"
edition = "2024"
description = "Reimplmenmentation of Comet's xcorr algorithm."
repository = "https://github.com/medbioinf/xcorrrs"
homepage = "https://github.com/medbioinf/xcorrrs"
documentation = "https://docs.rs/xcorrrs"
license-file = "LICENSE"
readme = "README.md"

exclude = [
    "/.github",
    "/test_files",
    "/.vscode",
]

[[bench]]
name = "preprocessing_bench"
harness = false

[dependencies]
ndarray = "0.16.1"
rustyms = "0.10.0"
serde = "1.0.228"
thiserror = "2.0.18"
rand = "0.10.0"
rayon = "1.11.0"
rand_distr = "0.6.0"

[dev-dependencies]
dihardts_omicstools = "3.1.0"
itertools = "0.14.0"
ndarray-stats = "0.6.0"
plotly = { version = "0.12.1", features = ["plotly_ndarray"]}
polars = { version = "0.49.1", features = ["decompress", "ndarray", "parquet"] }
criterion = "0.8.2" #is used for benchmark therefore do not remove


